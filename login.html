<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <style>
        /* CSS to create a centered, modern card design */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .login-container { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        .btn-submit { width: 100%; padding: 12px; background: #667eea; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header"><h2>Welcome Back</h2></div>
        <form action="#" method="POST">
            <div class="form-group"><label>Email</label><input type="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" required></div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>
    </div>
</body>
</html>
